<!DOCTYPE html>
<html lang="en" class="overlay-html" style="background: transparent !important; background-color: transparent !important; margin: 0; padding: 0; overflow: hidden;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eclipse Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: normal !important;
        background: transparent !important;
        background-color: transparent !important;
      }
      html, body, #root {
        background-color: transparent !important;
        background: transparent !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden !important;
        user-select: none;
        -webkit-user-select: none;
      }
    </style>
  </head>
  <body class="overlay-body" style="background-color: transparent !important; background: transparent !important; margin: 0; padding: 0;">
    <div id="root" class="overlay-root" style="background-color: transparent !important; background: transparent !important;"></div>
    <script type="module" src="/src/overlay.tsx"></script>
  </body>
</html>
